[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/Gxnza48/VRes"
homepage = "https://github.com/Gxnza48/VRes"
authors = ["VRes contributors"]
publish = false

[workspace.dependencies]
vres-core = { path = "crates/vres-core" }
vres-win = { path = "crates/vres-win" }
vres-engine = { path = "crates/vres-engine" }

clap = { version = "4", features = ["derive"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
ts-rs = "12"
tiny-skia = "0.12"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_UI_Magnification",
  "Win32_Media_Audio",
  "Win32_UI_ColorSystem",
  "Win32_Devices_Display",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_RemoteDesktop",
  "Win32_System_Power",
  "Win32_System_SystemServices",
  "Win32_System_Shutdown",
  "Win32_System_Console",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
