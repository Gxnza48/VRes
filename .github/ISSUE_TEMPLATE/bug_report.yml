name: Reportar un problema
description: Algo no funciona como debería.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Si tu pantalla quedó con colores raros, el atajo **Ctrl + Alt + Shift + R** (desde la v0.1) o el acceso directo **VRes — Restablecer pantalla** la devuelven a la normalidad.
  - type: textarea
    id: what
    attributes:
      label: ¿Qué pasó?
      description: Qué hiciste, qué esperabas y qué pasó en cambio.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir VRes
        2. ...
  - type: input
    id: version
    attributes:
      label: Versión de VRes
      placeholder: "0.0.1 (está en Más → Acerca de)"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: "Windows 11 24H2"
  - type: input
    id: gpu
    attributes:
      label: Placa de video y monitores
      placeholder: "RTX 4060 + monitor 1920×1080 a 165 Hz"
  - type: textarea
    id: log
    attributes:
      label: Log (opcional)
      description: "Está en %LOCALAPPDATA%\\io.github.gxnza48.vres\\logs\\vres.log. Revísalo antes de pegarlo."
      render: text
